<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR SNAKE — one prompt, one game</title>
<style>
  html, body { margin: 0; padding: 0; background: #070312; height: 100%; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
  h1 { color: #f5d90a; font-size: 28px; letter-spacing: 4px; margin: 0 0 4px; text-shadow: 0 0 18px rgba(245,217,10,.7); }
  #sub { color: #9be7ff; font-size: 14px; margin: 0 0 12px; letter-spacing: 2px; }
  #hud { display: flex; gap: 28px; color: #e8e6f0; font-size: 16px; margin-bottom: 10px; }
  #hud b { color: #f5d90a; }
  canvas { background: #0d0722; border: 2px solid #3b2a7a; border-radius: 12px; box-shadow: 0 0 40px rgba(123,47,247,.45); }
  #msg { color: #c9c4e0; font-size: 14px; margin-top: 12px; height: 20px; }
  #msg b { color: #9be7ff; }
</style>
</head>
<body>
<div id="wrap">
  <h1>STAR SNAKE</h1>
  <div id="sub">ONE PROMPT &middot; ONE GAME &middot; BUILT BY AN AI AGENT</div>
  <div id="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span><span>SPEED <b id="speed">1&times;</b></span></div>
  <canvas id="game" width="480" height="480"></canvas>
  <div id="msg">Arrow keys / WASD to steer &middot; eat the stars &middot; <b>Space</b> to restart</div>
</div>
<script>
(function () {
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var N = 24, CELL = 480 / N;
  var snake, dir, nextDir, star, score, best, alive, step, tick;
  var keyMap = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };

  function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = [1, 0]; nextDir = [1, 0];
    score = 0; alive = true; step = 0; tick = 0;
    placeStar();
    updateHud();
    document.getElementById('msg').innerHTML = 'Arrow keys / WASD to steer &middot; eat the stars &middot; <b>Space</b> to restart';
  }

  function placeStar() {
    do {
      star = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    } while (snake.some(function (s) { return s.x === star.x && s.y === star.y; }));
  }

  function speed() { return Math.max(70, 170 - score * 6); }

  function updateHud() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    document.getElementById('speed').textContent = (170 / speed()).toFixed(1) + 'x';
  }

  function draw() {
    ctx.clearRect(0, 0, 480, 480);
    // grid dots
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (var i = 0; i < N; i++) for (var j = 0; j < N; j++) ctx.fillRect(i * CELL + CELL / 2 - 1, j * CELL + CELL / 2 - 1, 2, 2);
    // star (pulsing)
    var pulse = 0.75 + 0.25 * Math.sin(tick / 6);
    ctx.save();
    ctx.translate(star.x * CELL + CELL / 2, star.y * CELL + CELL / 2);
    ctx.rotate(tick / 30);
    ctx.fillStyle = '#f5d90a';
    ctx.shadowColor = '#f5d90a'; ctx.shadowBlur = 18 * pulse;
    ctx.beginPath();
    for (var k = 0; k < 5; k++) {
      var a = -Math.PI / 2 + k * 2 * Math.PI / 5, r1 = 9 * pulse, r2 = 4;
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      a += Math.PI / 5;
      ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
    // snake
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i], t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#7cf29c' : 'rgb(' + Math.round(60 + 120 * (1 - t)) + ',' + Math.round(200 - 80 * t) + ',' + Math.round(120 + 60 * t) + ')';
      ctx.shadowColor = '#39d353'; ctx.shadowBlur = i === 0 ? 14 : 6;
      var pad = 1.5;
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    if (!alive) {
      ctx.fillStyle = 'rgba(7,3,18,0.72)';
      ctx.fillRect(0, 0, 480, 480);
      ctx.fillStyle = '#ff5d7a';
      ctx.font = 'bold 34px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', 240, 220);
      ctx.fillStyle = '#e8e6f0';
      ctx.font = '20px "Segoe UI", sans-serif';
      ctx.fillText('Score: ' + score + '  ·  Best: ' + best, 240, 260);
      ctx.fillStyle = '#9be7ff';
      ctx.font = '16px "Segoe UI", sans-serif';
      ctx.fillText('Press Space to play again', 240, 300);
    }
  }

  function loop() {
    tick++;
    if (alive) {
      step++;
      if (step * 16 >= speed()) {
        step = 0;
        dir = nextDir;
        var head = { x: snake[0].x + dir[0], y: snake[0].y + dir[1] };
        if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
            snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
          alive = false;
          best = Math.max(best, score);
          document.getElementById('msg').innerHTML = 'Game over — <b>Space</b> to play again';
        } else {
          snake.unshift(head);
          if (head.x === star.x && head.y === star.y) {
            score++;
            placeStar();
          } else {
            snake.pop();
          }
          updateHud();
        }
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { reset(); e.preventDefault(); return; }
    var d = keyMap[e.code];
    if (d && (d[0] !== -dir[0] || d[1] !== -dir[1])) nextDir = d;
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
